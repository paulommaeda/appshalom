name: Validar Igreja ERP Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }} / rede=${{ matrix.multisite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wordpress: '6.5.5'
            multisite: '0'
          - php: '8.3'
            wordpress: 'latest'
            multisite: '0'
          - php: '8.3'
            wordpress: 'latest'
            multisite: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: igreja_erp_test
          MYSQL_DATABASE: igreja_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pigreja_erp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      IGREJA_ERP_TEST_ENV: '1'
      WP_VERSION: ${{ matrix.wordpress }}
      IGREJA_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip
          coverage: none
      - name: Configurar captura de convites de teste
        run: printf 'IGREJA_INVITE_FILE=%s/igreja-invite.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validar sintaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Gerar e validar pacote
        run: |
          python3 scripts/package.py
          version=$(python3 -c 'import json; print(json.load(open("update.json"))["version"])')
          cp "dist/igreja-erp-core-$version.zip" "$RUNNER_TEMP/first.zip"
          python3 scripts/package.py
          cmp "dist/igreja-erp-core-$version.zip" "$RUNNER_TEMP/first.zip"
          addon_version=$(python3 -c 'import json; print(json.load(open("addons/igreja-erp-membros/update.json"))["version"])')
          cp "dist/igreja-erp-membros-$addon_version.zip" "$RUNNER_TEMP/first-addon.zip"
          python3 scripts/package.py
          cmp "dist/igreja-erp-membros-$addon_version.zip" "$RUNNER_TEMP/first-addon.zip"
      - name: Preparar WordPress e MySQL
        run: |
          curl --fail --retry 3 --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output "$RUNNER_TEMP/wp-cli.phar"
          mkdir "$RUNNER_TEMP/wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$RUNNER_TEMP/wordpress" --version="$WP_VERSION" --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config create --path="$RUNNER_TEMP/wordpress" --dbname=igreja_erp_test --dbuser=root --dbpass=igreja_erp_test --dbhost=127.0.0.1:3306 --dbprefix=shalom_test_ --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config set WP_ENVIRONMENT_TYPE local --path="$RUNNER_TEMP/wordpress" --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config set DISABLE_WP_CRON true --raw --path="$RUNNER_TEMP/wordpress" --quiet
          if [ "$IGREJA_MULTISITE" = "1" ]; then
            php "$RUNNER_TEMP/wp-cli.phar" core multisite-install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title="Igreja ERP Test" --admin_user=tests --admin_password=igreja_erp_disposable_test --admin_email=test@example.org --skip-email --quiet
          else
            php "$RUNNER_TEMP/wp-cli.phar" core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title="Igreja ERP Test" --admin_user=tests --admin_password=igreja_erp_disposable_test --admin_email=test@example.org --skip-email --quiet
          fi
          php "$RUNNER_TEMP/wp-cli.phar" option update siteurl http://127.0.0.1:8080 --path="$RUNNER_TEMP/wordpress" --quiet
          php "$RUNNER_TEMP/wp-cli.phar" option update home http://127.0.0.1:8080 --path="$RUNNER_TEMP/wordpress" --quiet
          version=$(python3 -c 'import json; print(json.load(open("update.json"))["version"])')
          php "$RUNNER_TEMP/wp-cli.phar" plugin install "$GITHUB_WORKSPACE/dist/igreja-erp-core-$version.zip" --path="$RUNNER_TEMP/wordpress"
          if [ "$IGREJA_MULTISITE" = "1" ]; then
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-core --network --path="$RUNNER_TEMP/wordpress"
          else
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-core --path="$RUNNER_TEMP/wordpress"
          fi
      - name: Testar migrações, RBAC, REST e atualização nativa
        run: php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path="$RUNNER_TEMP/wordpress"
      - name: Testar configurações e isolamento por igreja
        run: php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/settings.php" --path="$RUNNER_TEMP/wordpress"
      - name: Instalar e ativar addon independente de membros
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval 'if (class_exists("IgrejaERP\\Core\\Membros") || class_exists("IgrejaERP\\Core\\Registration")) { throw new RuntimeException("O Core carregou recursos do addon ausente"); }' --path="$RUNNER_TEMP/wordpress"
          addon_version=$(python3 -c 'import json; print(json.load(open("addons/igreja-erp-membros/update.json"))["version"])')
          php "$RUNNER_TEMP/wp-cli.phar" plugin install "$GITHUB_WORKSPACE/dist/igreja-erp-membros-$addon_version.zip" --path="$RUNNER_TEMP/wordpress"
          if [ "$IGREJA_MULTISITE" = "1" ]; then
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-membros --network --path="$RUNNER_TEMP/wordpress"
          else
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-membros --path="$RUNNER_TEMP/wordpress"
          fi
      - name: Testar membros, famílias e Turnstile no servidor
        run: php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/members.php" --path="$RUNNER_TEMP/wordpress"
      - name: Testar importação, aprovação, homônimos e convites
        run: php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/accounts-transfer.php" --path="$RUNNER_TEMP/wordpress"
      - name: Testar endereço individual, campos públicos e CSV
        run: php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/address.php" --path="$RUNNER_TEMP/wordpress"
      - name: Preparar navegador e servidor local
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.65.1
          node "$RUNNER_TEMP/browser/node_modules/@playwright/test/cli.js" install --with-deps chromium
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/wordpress" "$GITHUB_WORKSPACE/tests/router.php" >"$RUNNER_TEMP/wordpress-http.log" 2>&1 &
      - name: Testar acesso restrito e configurações no navegador
        env:
          IGREJA_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/@playwright/test
        run: node tests/branding.browser.cjs
      - name: Testar gestão de membros e formulário público no navegador
        env:
          IGREJA_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/@playwright/test
        run: node tests/members.browser.cjs
      - name: Testar consulta de CEP e endereço no navegador
        env:
          IGREJA_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/@playwright/test
        run: node tests/address.browser.cjs
      - name: Testar importação e definição de senha no navegador
        env:
          IGREJA_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/@playwright/test
        run: node tests/transfer.browser.cjs
      - name: Testar ativação e desativação dos addons no navegador
        env:
          IGREJA_PLAYWRIGHT: ${{ runner.temp }}/browser/node_modules/@playwright/test
        run: node tests/addons.browser.cjs
      - name: Confirmar Core independente e preservação dos dados
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/core-alone.php" --path="$RUNNER_TEMP/wordpress"
          if [ "$IGREJA_MULTISITE" = "1" ]; then
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-membros --network --path="$RUNNER_TEMP/wordpress"
          else
            php "$RUNNER_TEMP/wp-cli.phar" plugin activate igreja-erp-membros --path="$RUNNER_TEMP/wordpress"
          fi
      - name: Mostrar diagnóstico HTTP em caso de falha
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/wordpress-http.log" || true
      - name: Confirmar inicialização após atualização
        run: |
          if [ "$IGREJA_MULTISITE" = "1" ]; then
            php "$RUNNER_TEMP/wp-cli.phar" plugin is-active igreja-erp-core --network --path="$RUNNER_TEMP/wordpress"
          else
            php "$RUNNER_TEMP/wp-cli.phar" plugin is-active igreja-erp-core --path="$RUNNER_TEMP/wordpress"
          fi
          php "$RUNNER_TEMP/wp-cli.phar" eval 'if (get_option("igreja_erp_core_db_version") !== IGREJA_ERP_CORE_DB_VERSION || did_action("igreja_erp_core_loaded") !== 1) { throw new RuntimeException("Falha após atualização"); }' --path="$RUNNER_TEMP/wordpress"

  release:
    name: Publicar ZIP validado
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: igreja-erp-core-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Gerar pacote da release
        run: python3 scripts/package.py
      - name: Publicar versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_package() {
            local release_tag="$1" release_file="$2" release_notes="$3" release_title="$4"
            if gh release view "$release_tag" --json tagName >/dev/null 2>&1; then
              mkdir -p "$RUNNER_TEMP/existing-$release_tag"
              gh release download "$release_tag" --pattern "$(basename "$release_file")" --dir "$RUNNER_TEMP/existing-$release_tag"
              cmp "$release_file" "$RUNNER_TEMP/existing-$release_tag/$(basename "$release_file")" || { echo "Incremente a versão: a release $release_tag já possui outro conteúdo."; exit 1; }
            else
              gh release create "$release_tag" "$release_file" --target "$GITHUB_SHA" --title "$release_title" --notes-file "$release_notes"
            fi
          }
          core_version=$(python3 -c 'import json; print(json.load(open("update.json"))["version"])')
          addon_version=$(python3 -c 'import json; print(json.load(open("addons/igreja-erp-membros/update.json"))["version"])')
          publish_package "v$core_version" "dist/igreja-erp-core-$core_version.zip" RELEASE_NOTES.md "Igreja ERP Core $core_version"
          publish_package "membros-v$addon_version" "dist/igreja-erp-membros-$addon_version.zip" addons/igreja-erp-membros/RELEASE_NOTES.md "Igreja ERP — Membros $addon_version"
